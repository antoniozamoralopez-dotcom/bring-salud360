<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Salud 360</title>
<style>
:root{--bg:#101114;--card:#1c1f24;--card2:#292d34;--txt:#f7f8f8;--muted:#aeb5bf;--green:#8be28b;--orange:#ffbe5c;--red:#ff7575}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px);font-size:18px}.hidden{display:none!important}.top{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:rgba(16,17,20,.97);padding:4px 0 10px;z-index:6}.brand{flex:1}.brand b{display:block;color:var(--green);font-size:14px;letter-spacing:.08em}.brand span{font-size:15px;color:var(--muted)}.icon{width:48px;height:48px;border-radius:15px;border:0;background:var(--card);color:var(--txt);font-size:23px}.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0}.title{font-size:30px;line-height:1.08;font-weight:900;margin:5px 0}.subtitle{color:var(--muted);font-size:17px;line-height:1.4}.status{color:var(--green);font-weight:900;font-size:14px}.warning{color:var(--orange)}button{border:0;border-radius:17px;background:var(--card2);color:var(--txt);font:inherit;font-weight:900;min-height:58px;padding:12px 14px}button:disabled{opacity:.45}.primary{background:var(--green);color:#09250f;width:100%;font-size:20px}.secondary{width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modules{display:grid;gap:12px}.module{width:100%;text-align:left;padding:20px}.module strong{display:block;font-size:26px}.module small{display:block;color:var(--muted);font-weight:600;margin-top:5px}.list button{display:block;width:100%;text-align:left;margin:9px 0;padding:15px}.list small{display:block;color:var(--muted);font-weight:600;margin-top:5px}.imgbox{height:210px;border-radius:18px;background:var(--card2);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);overflow:hidden}.imgbox img{width:100%;height:100%;object-fit:cover}.rx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metric{background:var(--card2);border-radius:17px;padding:13px}.metric small{display:block;color:var(--muted);font-size:13px;font-weight:800}.metric strong{display:block;font-size:24px;margin-top:3px}.cue{background:#242a24;border-left:5px solid var(--green);padding:14px;border-radius:12px;margin-top:12px;font-size:18px;line-height:1.4}.details{margin-top:12px}.details summary{background:var(--card2);padding:16px;border-radius:15px;font-weight:900}.details p{font-size:20px;line-height:1.55;margin:14px 4px 4px}.footerhint{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}.overlay{position:fixed;inset:0;background:#0c0d0f;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}.clock{font-size:72px;font-weight:950}.overlay h2{font-size:28px;margin:12px}.overlay .next{color:var(--muted);font-size:18px;margin-bottom:26px}.overlay button{width:min(420px,100%);margin-top:10px}.menu{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:30;padding:70px 18px 20px}.menubox{max-width:520px;margin:auto;background:var(--card);border-radius:24px;padding:18px}.menubox h2{margin:0 0 12px}.menubox button{width:100%;margin:7px 0;text-align:left}.setup{text-align:center;margin-top:10vh}.setup h1{font-size:34px}.setup p{color:var(--muted);line-height:1.45}.offline{color:var(--orange)!important}.meal{background:var(--card);border-radius:20px;padding:16px;margin:10px 0}.meal .mealname{font-size:22px;font-weight:900}.meal .meta{color:var(--muted);margin-top:5px}.done{color:var(--green);font-weight:900}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.tabs button{min-height:48px;padding:8px;font-size:15px}.mic{position:sticky;bottom:12px;z-index:8;margin-top:18px;width:100%;background:#3c2830}.mic.recording{background:var(--red);color:#240000}.voiceinfo{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}.recipeLink{margin-top:12px;width:100%;background:var(--card2)}.hiit{text-align:center}.hiit .big{font-size:78px;font-weight:950}.hiit h2{font-size:34px;margin:8px}
</style></head><body>
<div id="setup" class="setup hidden"><div class="status">SALUD 360 · VISOR</div><h1>Vincular carpeta</h1><p>Selecciona en Google Drive la carpeta <b>02_App_Visor_Salud_360</b>. Es la única carpeta que necesita la aplicación.</p><button class="primary" onclick="Android.chooseFolder()">ELEGIR CARPETA DE DRIVE</button></div>
<div id="app" class="hidden"><div class="top"><button class="icon" onclick="openMenu()">☰</button><div class="brand"><b>SALUD 360</b><span id="syncLabel">Sincronizando…</span></div><button class="icon" onclick="manualSync()">↻</button></div><main id="content"></main><button id="micButton" class="mic hidden" onclick="toggleVoice()">🎙 NOTA DE VOZ</button><div id="voiceInfo" class="voiceinfo hidden"></div></div>
<div id="restOverlay" class="overlay hidden"><div class="status">DESCANSO</div><div id="restClock" class="clock">00:00</div><h2 id="restTitle"></h2><div id="restNext" class="next"></div><button class="secondary" onclick="closeRest()">VOLVER</button><button onclick="skipRest()">SALTAR DESCANSO</button></div>
<div id="menu" class="menu hidden"><div class="menubox"><h2>Salud 360</h2><button onclick="home();closeMenu()">⌂ Inicio</button><button id="mTrain" class="hidden" onclick="openTraining();closeMenu()">🏋️ Entrenamiento</button><button id="mFood" class="hidden" onclick="openFood();closeMenu()">🍽 Alimentación</button><button id="mHiit" class="hidden" onclick="openHiit();closeMenu()">⏱ HIIT / Circuitos</button><button onclick="manualSync();closeMenu()">↻ Sincronizar ahora</button><button onclick="syncVoice();closeMenu()">🎙 Sincronizar notas de voz</button><button onclick="changeFolder();closeMenu()">📁 Cambiar carpeta de Drive</button><button onclick="closeMenu()">Cerrar</button></div></div>
<script>
let DATA=null,sessions=[],sessionIndex=0,exerciseIndex=0,trainView='exercise',screen='home',foodTab='today',foodDayIndex=0,restTimer=null,restEnd=0,hiitTimer=null,hiitState=null,recording=false;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showSetup(){$('setup').classList.remove('hidden');$('app').classList.add('hidden')}window.showSetup=showSetup;function manualSync(){if(window.Android){$('syncLabel').textContent='Sincronizando…';Android.refresh()}}function changeFolder(){if(window.Android){Android.forgetFolder();setTimeout(()=>Android.chooseFolder(),150)}}
window.onNativeSync=function(raw){let p;try{p=JSON.parse(raw)}catch(e){return}if(!p.ok){showSetup();$('setup').querySelector('p').innerHTML='La carpeta está vinculada, pero <b>'+esc(p.error||'no puedo leer los archivos')+'</b>.<br><br>Elige la carpeta raíz correcta.';return}DATA=p;sessions=(p.plan&&p.plan.sessions)||[];$('setup').classList.add('hidden');$('app').classList.remove('hidden');let off=!!p.offline;$('syncLabel').textContent=off?'Sin conexión · usando datos guardados':'Drive · '+(p.folder||'sincronizado');$('syncLabel').classList.toggle('offline',off);let enabled=(p.config&&p.config.enabled_modules)||[];$('mTrain').classList.toggle('hidden',!enabled.includes('fuerza'));$('mHiit').classList.toggle('hidden',!enabled.includes('hiit'));$('mFood').classList.toggle('hidden',!enabled.includes('alimentacion'));if(screen==='home')home();else render();updateVoicePending()};
function enabled(x){return ((DATA&&DATA.config&&DATA.config.enabled_modules)||[]).includes(x)}function home(){screen='home';hideMic();let h='<div class="card"><div class="status">VISOR PERSONAL</div><div class="title">¿Qué quieres ver?</div><div class="subtitle">ChatGPT decide y estructura. Drive conserva. Esta app solo te lo muestra y ejecuta.</div></div><div class="modules">';if(enabled('fuerza'))h+='<button class="module" onclick="openTraining()"><strong>🏋️ Entrenamiento</strong><small>Sesión, ejercicios, descansos y ejecución.</small></button>';if(enabled('alimentacion'))h+='<button class="module" onclick="openFood()"><strong>🍽 Alimentación</strong><small>Qué toca hoy, historial y recetas.</small></button>';if(enabled('hiit'))h+='<button class="module" onclick="openHiit()"><strong>⏱ HIIT</strong><small>Intervalos automáticos.</small></button>';h+='</div>';$('content').innerHTML=h}
function selectToday(){if(!sessions.length){sessionIndex=0;return}let iso=todayIso(),idx=sessions.findIndex(s=>s.date===iso);if(idx<0){idx=sessions.findIndex(s=>s.date>iso);if(idx<0)idx=sessions.length-1}sessionIndex=idx;exerciseIndex=0}function todayIso(){let d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function current(){return sessions[sessionIndex]||null}function lib(id){return (((DATA||{}).library||{}).exercises||{})[id]||{name:id,category:'',how_to:'Sin explicación todavía.',image:''}};
function openTraining(){screen='training';selectToday();trainView='exercise';render();showMic()}function render(){if(screen==='training')renderTraining();else if(screen==='food')renderFood();else if(screen==='hiit')renderHiit();else home()}
function stateKey(eid){let s=current();return 'v03_'+(s?s.date:'x')+'_'+eid}function getState(eid){try{return JSON.parse(localStorage.getItem(stateKey(eid))||'{"wu":0,"sets":0}')}catch(e){return{wu:0,sets:0}}}function setState(eid,x){localStorage.setItem(stateKey(eid),JSON.stringify(x))}function dayLabel(s){return new Date(s.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}
function renderTraining(){let s=current();if(!s){$('content').innerHTML='<div class="card"><div class="title">Sin sesiones</div><div class="subtitle">No hay sesiones cargadas.</div></div>';return}if(s.module==='hiit'){screen='hiit';renderHiit();return}trainView==='day'?renderDay(s):renderExercise(s)}function renderDay(s){let h='<div class="card"><div class="status">ENTRENAMIENTO</div><div class="title">'+esc(s.title||'Sesión')+'</div><div class="subtitle">'+esc(dayLabel(s))+'</div>'+(s.notes?'<div class="cue warning">'+esc(s.notes)+'</div>':'')+'</div><div class="list">';(s.exercises||[]).forEach((e,i)=>{let L=lib(e.exercise_id),st=getState(e.exercise_id),done=(st.wu>=Number(e.warmup_sets||0)&&st.sets>=Number(e.work_sets||0));h+='<button onclick="exerciseIndex='+i+';trainView=\'exercise\';render()">'+(done?'✓ ':'')+esc(L.name)+'<small>'+esc(L.category)+' · '+(e.work_sets||0)+'×'+(e.reps||0)+(e.load_kg?' · '+e.load_kg+' kg':'')+'</small></button>'});h+='</div><div class="row"><button onclick="changeDay(-1)">← DÍA</button><button onclick="changeDay(1)">DÍA →</button></div>';$('content').innerHTML=h}
function renderExercise(s){let arr=s.exercises||[];if(!arr.length){trainView='day';renderDay(s);return}exerciseIndex=Math.max(0,Math.min(arr.length-1,exerciseIndex));let e=arr[exerciseIndex],L=lib(e.exercise_id),st=getState(e.exercise_id),wu=Number(e.warmup_sets||0),ws=Number(e.work_sets||0),phase=st.wu<wu?'Calentamiento '+(st.wu+1)+' / '+wu:st.sets<ws?'Serie '+(st.sets+1)+' / '+ws:'Ejercicio completado',reps=st.wu<wu?(e.warmup_reps||e.reps):e.reps,img=L.image?loadImage((DATA.config.images_folder||'03_Imagenes_Ejercicios')+'/'+L.image):'';let h='<div class="card"><div class="status">'+esc(dayLabel(s))+' · '+(exerciseIndex+1)+'/'+arr.length+'</div><div class="imgbox">'+(img?'<img src="'+img+'">':(DATA.offline?'SIN IMAGEN · MODO OFFLINE':'IMAGEN PENDIENTE'))+'</div><div class="title">'+esc(L.name)+'</div><div class="subtitle">'+esc(L.category)+'</div><div class="rx"><div class="metric"><small>FASE</small><strong>'+esc(phase)+'</strong></div><div class="metric"><small>REPETICIONES</small><strong>'+esc(reps)+'</strong></div><div class="metric"><small>CARGA</small><strong>'+(e.load_kg?esc(e.load_kg)+' kg':'—')+'</strong></div><div class="metric"><small>DESCANSO</small><strong>'+fmt((e.rest_seconds||60)*1000)+'</strong></div></div><div class="cue"><b>Ejecución:</b><br>'+esc(e.execution||'Controlada y técnicamente limpia.')+'</div><details class="details"><summary>¿Cómo se hace?</summary><p>'+esc(L.how_to)+'</p></details></div><button class="primary" '+((st.wu>=wu&&st.sets>=ws)?'disabled':'')+' onclick="completeSet()">✓ HECHO</button><div class="row" style="margin-top:10px"><button onclick="changeExercise(-1)">← EJERCICIO</button><button onclick="changeExercise(1)">EJERCICIO →</button></div><button class="secondary" style="margin-top:10px" onclick="trainView=\'day\';render()">VER EJERCICIOS DEL DÍA</button>';$('content').innerHTML=h}
function loadImage(path){try{return window.Android?Android.getImage(path):''}catch(e){return''}}function completeSet(){let s=current(),e=s.exercises[exerciseIndex],st=getState(e.exercise_id),wu=Number(e.warmup_sets||0),ws=Number(e.work_sets||0);if(st.wu<wu)st.wu++;else if(st.sets<ws)st.sets++;setState(e.exercise_id,st);let done=st.wu>=wu&&st.sets>=ws;startRest(Number(e.rest_seconds||60),lib(e.exercise_id).name,done?nextExerciseName():'Siguiente serie');render()}function nextExerciseName(){let s=current(),n=s.exercises[exerciseIndex+1];return n?'Después: '+lib(n.exercise_id).name:'Último ejercicio de la sesión'}function changeExercise(d){let s=current();exerciseIndex=Math.max(0,Math.min((s.exercises||[]).length-1,exerciseIndex+d));render()}function changeDay(d){sessionIndex=Math.max(0,Math.min(sessions.length-1,sessionIndex+d));exerciseIndex=0;render()}
function startRest(sec,name,next){clearInterval(restTimer);restEnd=Date.now()+sec*1000;$('restTitle').textContent=name;$('restNext').textContent=next;$('restOverlay').classList.remove('hidden');tickRest();restTimer=setInterval(tickRest,250)}function tickRest(){let left=Math.max(0,restEnd-Date.now());$('restClock').textContent=fmt(left);if(left<=0){clearInterval(restTimer);restTimer=null;if(window.Android)Android.longCue();$('restNext').textContent='Descanso terminado ✓'}}function closeRest(){$('restOverlay').classList.add('hidden')}function skipRest(){restEnd=Date.now();tickRest();closeRest()}function fmt(ms){let s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function foodData(){return (DATA&&DATA.modules&&DATA.modules.alimentacion)||{}}function openFood(){screen='food';foodTab='today';foodDayIndex=0;renderFood();showMic()}function foodDays(){let f=foodData(),p=(f.plan&&f.plan.days)||[],h=(f.history&&f.history.days)||[];let by={};[...h,...p].forEach(d=>{if(d&&d.date)by[d.date]=Object.assign({},by[d.date]||{},d,{meals:d.meals||((by[d.date]||{}).meals)||[]})});return Object.values(by).sort((a,b)=>a.date.localeCompare(b.date))}function renderFood(){let h='<div class="tabs"><button onclick="foodTab=\'today\';renderFood()">HOY</button><button onclick="foodTab=\'history\';renderFood()">HISTORIAL</button><button onclick="foodTab=\'recipes\';renderFood()">RECETAS</button></div>';if(foodTab==='recipes'){renderRecipes(h);return}let days=foodDays();if(!days.length){$('content').innerHTML=h+'<div class="card"><div class="title">Alimentación</div><div class="subtitle">El módulo ya está preparado, pero todavía no hay comidas cargadas en Drive.</div></div>';return}let idx;if(foodTab==='today'){idx=days.findIndex(d=>d.date===todayIso());if(idx<0)idx=days.length-1}else{idx=Math.max(0,Math.min(days.length-1,foodDayIndex||days.length-1));foodDayIndex=idx}let d=days[idx];h+='<div class="card"><div class="status">ALIMENTACIÓN</div><div class="title">'+esc(d.title||new Date(d.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))+'</div><div class="subtitle">'+esc(d.notes||'')+'</div></div>';let meals=d.meals||[];if(!meals.length)h+='<div class="card"><div class="subtitle">No hay comidas registradas para este día.</div></div>';meals.forEach(m=>{h+='<div class="meal"><div class="'+(m.status==='done'?'done':'status')+'">'+(m.status==='done'?'✓ REALIZADA':'PREVISTA')+'</div><div class="mealname">'+esc(m.name||'Comida')+'</div><div class="meta">'+esc([m.time,m.quantity_text].filter(Boolean).join(' · '))+'</div>'+(m.description?'<div class="cue">'+esc(m.description)+'</div>':'')+(m.recipe_id?'<button class="recipeLink" onclick="openRecipe(\''+esc(m.recipe_id)+'\')">VER RECETA</button>':'')+'</div>'});if(foodTab==='history')h+='<div class="row"><button onclick="foodDayIndex=Math.max(0,'+idx+'-1);renderFood()">← DÍA</button><button onclick="foodDayIndex=Math.min(foodDays().length-1,'+idx+'+1);renderFood()">DÍA →</button></div>';$('content').innerHTML=h}
function recipesObj(){return (foodData().recipes&&foodData().recipes.recipes)||{}}function renderRecipes(prefix){let r=recipesObj(),keys=Object.keys(r),h=prefix+'<div class="card"><div class="status">RECETAS</div><div class="title">Biblioteca</div></div><div class="list">';if(!keys.length)h+='<div class="card"><div class="subtitle">Todavía no hay recetas guardadas.</div></div>';keys.forEach(k=>{let x=r[k];h+='<button onclick="openRecipe(\''+esc(k)+'\')">'+esc(x.name||k)+'<small>'+esc(x.summary||'')+'</small></button>'});h+='</div>';$('content').innerHTML=h}function openRecipe(id){let x=recipesObj()[id];if(!x)return;foodTab='recipes';let h='<button class="secondary" onclick="renderFood()">← RECETAS</button><div class="card"><div class="status">RECETA</div><div class="title">'+esc(x.name||id)+'</div>'+(x.ingredients?'<div class="cue"><b>Ingredientes</b><br>'+esc(Array.isArray(x.ingredients)?x.ingredients.join('\n'):x.ingredients).replace(/\n/g,'<br>')+'</div>':'')+(x.steps?'<details class="details" open><summary>Preparación</summary><p>'+esc(Array.isArray(x.steps)?x.steps.join('\n\n'):x.steps).replace(/\n/g,'<br>')+'</p></details>':'')+(x.video_url?'<button class="primary" style="margin-top:12px" onclick="Android.openUrl(\''+esc(x.video_url)+'\')">▶ VER VÍDEO</button>':'')+'</div>';$('content').innerHTML=h}
function openHiit(){screen='hiit';showMic();hiitState=null;renderHiit()}function renderHiit(){let h=DATA&&DATA.modules&&DATA.modules.hiit;if(!h||!Object.keys(h).length){$('content').innerHTML='<div class="card"><div class="title">HIIT</div><div class="subtitle">No hay circuito cargado.</div></div>';return}if(!hiitState){$('content').innerHTML='<div class="card"><div class="status">HIIT</div><div class="title">'+esc(h.title||'Circuito')+'</div><div class="subtitle">'+esc(h.description||'Transiciones automáticas.')+'</div></div><button class="primary" onclick="startHiit()">INICIAR</button>';return}$('content').innerHTML='<div class="card hiit"><div class="status">RONDA '+hiitState.round+' / '+(h.rounds||1)+'</div><h2>'+esc(hiitState.phase==='work'?(h.work_label||'TRABAJO'):(h.rest_label||'RECUPERACIÓN'))+'</h2><div class="big">'+hiitState.left+'</div><div class="subtitle">'+esc(hiitState.phase==='work'?(h.work_cue||''):(h.rest_cue||''))+'</div></div><button class="secondary" onclick="stopHiit()">DETENER</button>'}function startHiit(){let h=DATA.modules.hiit;hiitState={round:1,phase:'work',left:Number(h.work_seconds||20)};clearInterval(hiitTimer);hiitTimer=setInterval(()=>{if(!hiitState)return;hiitState.left--;if(hiitState.left<=0){if(window.Android)Android.cue();if(hiitState.phase==='work'){hiitState.phase='rest';hiitState.left=Number(h.rest_seconds||40)}else if(hiitState.round<Number(h.rounds||1)){hiitState.round++;hiitState.phase='work';hiitState.left=Number(h.work_seconds||20)}else{clearInterval(hiitTimer);hiitState=null;if(window.Android)Android.longCue();$('content').innerHTML='<div class="card"><div class="title">HIIT terminado ✓</div></div>';return}}renderHiit()},1000);renderHiit()}function stopHiit(){clearInterval(hiitTimer);hiitState=null;renderHiit()}
function activeContext(){if(screen==='training'){let s=current(),e=s&&(s.exercises||[])[exerciseIndex];return{session:s?(s.date+' · '+(s.title||'')):'',exercise:e?lib(e.exercise_id).name:''}}if(screen==='food')return{session:'Alimentación · '+todayIso(),exercise:''};if(screen==='hiit')return{session:'HIIT · '+todayIso(),exercise:''};return{session:'Salud 360 · '+todayIso(),exercise:''}}function showMic(){$('micButton').classList.remove('hidden');$('voiceInfo').classList.remove('hidden');updateVoicePending()}function hideMic(){$('micButton').classList.add('hidden');$('voiceInfo').classList.add('hidden')}function toggleVoice(){if(!window.Android)return;if(recording){Android.stopVoice()}else{let c=activeContext();Android.startVoice(c.session,c.exercise)}}function updateVoicePending(){try{let n=window.Android?Android.pendingVoiceCount():0;$('voiceInfo').textContent=n?n+' nota'+(n===1?'':'s')+' de voz pendiente'+(n===1?'':'s')+' de sincronizar':''}catch(e){}}function syncVoice(){if(window.Android)Android.syncVoice()}window.onVoiceStatus=function(status,detail){recording=status==='recording';$('micButton').classList.toggle('recording',recording);$('micButton').textContent=recording?'■ PARAR Y GUARDAR':'🎙 NOTA DE VOZ';$('voiceInfo').classList.remove('hidden');$('voiceInfo').textContent=detail||'';setTimeout(updateVoicePending,1600)};
function openMenu(){$('menu').classList.remove('hidden')}function closeMenu(){$('menu').classList.add('hidden')}
let sx=0,sy=0;document.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5)return;if(screen==='training'){if(trainView==='day')changeDay(dx<0?1:-1);else changeExercise(dx<0?1:-1)}},{passive:true});
if(window.Android&&!Android.hasFolder())showSetup();
</script></body></html>
