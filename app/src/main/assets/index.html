let DATA=null,sessions=[],screen='home',sessionIndex=0,exerciseIndex=0,foodTab='today',foodDayIndex=0;let restTimer=null,restEnd=0,restLabel='',restNext='';let hiitTimer=null,hiitState=null,recording=false,sessionTicker=null;let EXEC={schema_version:1,module:'training_execution',updated_at_ms:0,updated_by:'app',sessions:{}};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const num=v=>{let n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0};
function showSetup(){$('setup').classList.remove('hidden');$('app').classList.add('hidden')}window.showSetup=showSetup;function manualSync(){if(window.Android){$('syncLabel').textContent='Sincronizando…';Android.refresh()}}function changeFolder(){if(window.Android){Android.forgetFolder();setTimeout(()=>Android.chooseFolder(),150)}}
function configEnabled(id){let base=((DATA&&DATA.config&&DATA.config.enabled_modules)||[]);if(id==='entrenamiento')return base.includes('entrenamiento')||base.includes('fuerza');return base.includes(id)}function disabledLocal(){try{return JSON.parse(localStorage.getItem('s360_disabled_modules')||'[]')}catch(e){return[]}}function enabled(id){return configEnabled(id)&&!disabledLocal().includes(id)}function setModuleEnabled(id,on){let d=disabledLocal().filter(x=>x!==id);if(!on)d.push(id);localStorage.setItem('s360_disabled_modules',JSON.stringify(d));renderSettings()}function moduleVisibility(){[['mTraining','entrenamiento'],['mFood','alimentacion'],['mRecipes','recetas'],['mShopping','compra'],['mPantry','despensa'],['mConsumables','consumibles'],['mSleep','sueno'],['mSupplements','suplementacion'],['mHiit','hiit']].forEach(([el,id])=>$(el).classList.toggle('hidden',!enabled(id)))}
window.onNativeSync=function(raw){let p;try{p=JSON.parse(raw)}catch(e){return}if(!p.ok){showSetup();$('setup').querySelector('p').innerHTML='La carpeta está vinculada, pero <b>'+esc(p.error||'no puedo leer los archivos')+'</b>.<br><br>Elige la carpeta raíz correcta.';return}DATA=p;sessions=(p.plan&&p.plan.sessions)||[];let incoming=(p.modules&&p.modules.training_execution)||p.execution||null;mergeExecution(incoming);$('setup').classList.add('hidden');$('app').classList.remove('hidden');let off=!!p.offline;$('syncLabel').textContent=off?'OFFLINE · datos guardados':'Drive · '+(p.folder||'sincronizado');$('syncLabel').classList.toggle('offline',off);$('offlineBanner').classList.toggle('hidden',!off);moduleVisibility();if(screen==='home')home();else render();updateVoicePending()};
function mergeExecution(incoming){let local=null;try{local=JSON.parse(localStorage.getItem('s360_exec')||'null')}catch(e){}let a=incoming&&incoming.sessions?incoming:null,b=local&&local.sessions?local:null;if(a&&b)EXEC=(Number(a.updated_at_ms||0)>=Number(b.updated_at_ms||0))?a:b;else EXEC=a||b||EXEC;localStorage.setItem('s360_exec',JSON.stringify(EXEC))}function persistExec(source='app'){EXEC.updated_at_ms=Date.now();EXEC.updated_by=source;localStorage.setItem('s360_exec',JSON.stringify(EXEC));if(window.Android&&Android.saveTrainingExecution)Android.saveTrainingExecution(JSON.stringify(EXEC))}
function todayIso(){let d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function dayLabel(s){return new Date(s.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}function current(){return sessions[sessionIndex]||null}function lib(id){return (((DATA||{}).library||{}).exercises||{})[id]||{name:id,category:'',how_to:'Sin explicación todavía.',image:'',image_start:'',image_end:''}}function selectToday(){if(!sessions.length){sessionIndex=0;return}let iso=todayIso(),idx=sessions.findIndex(s=>s.date===iso);if(idx<0){idx=sessions.findIndex(s=>s.date>iso);if(idx<0)idx=sessions.length-1}sessionIndex=idx;exerciseIndex=0}function loadImage(path){try{return window.Android?Android.getImage(path):''}catch(e){return''}}function imgFor(L,kind='thumb'){let file=kind==='start'?(L.image_start||L.image):(kind==='end'?(L.image_end||L.image):L.image);if(!file)return'';return loadImage(((DATA&&DATA.config&&DATA.config.images_folder)||'03_Imagenes_Ejercicios')+'/'+file)}function parseSuggestedReps(v){if(typeof v==='number')return String(v);let s=String(v??'').trim();if(!s)return'';let m=s.match(/(\d+)\s*$/);return m?m[1]:''}function planText(set){let x=[];if(set.planned_kg!==''&&set.planned_kg!=null)x.push(set.planned_kg+' kg');if(set.planned_reps)x.push('× '+set.planned_reps);return x.join(' ')||'—'}
function executionSession(s,create=true){if(!s)return null;let key=s.date;if(!EXEC.sessions)EXEC.sessions={};if(!EXEC.sessions[key]&&create){let ex={};(s.exercises||[]).forEach(e=>{let sets=[],wu=Number(e.warmup_sets||0),ws=Number(e.work_sets||0);for(let i=0;i<wu;i++)sets.push({type:'warmup',index:i+1,planned_kg:e.warmup_load_kg??'',planned_reps:e.warmup_reps??'',actual_kg:e.warmup_load_kg??'',actual_reps:parseSuggestedReps(e.warmup_reps),rir:'',done:false,done_at:null});for(let i=0;i<ws;i++)sets.push({type:'work',index:i+1,planned_kg:(e.load_kg&&Number(e.load_kg)!==0)?e.load_kg:'',planned_reps:e.reps??'',actual_kg:(e.load_kg&&Number(e.load_kg)!==0)?e.load_kg:'',actual_reps:parseSuggestedReps(e.reps),rir:e.rir_target??'',done:false,done_at:null});ex[e.exercise_id]={sets,notes:''}});EXEC.sessions[key]={date:key,title:s.title||'',status:'planned',started_at:null,finalized_at:null,reopened_at:null,notes:'',exercises:ex};persistExec('app_init')}return EXEC.sessions[key]||null}
function normalizeExecAgainstPlan(s){let x=executionSession(s,true);if(!x)return;(s.exercises||[]).forEach(e=>{if(!x.exercises[e.exercise_id]){x.exercises[e.exercise_id]={sets:[],notes:''};let wu=Number(e.warmup_sets||0),ws=Number(e.work_sets||0);for(let i=0;i<wu;i++)x.exercises[e.exercise_id].sets.push({type:'warmup',index:i+1,planned_kg:e.warmup_load_kg??'',planned_reps:e.warmup_reps??'',actual_kg:e.warmup_load_kg??'',actual_reps:parseSuggestedReps(e.warmup_reps),rir:'',done:false,done_at:null});for(let i=0;i<ws;i++)x.exercises[e.exercise_id].sets.push({type:'work',index:i+1,planned_kg:(e.load_kg&&Number(e.load_kg)!==0)?e.load_kg:'',planned_reps:e.reps??'',actual_kg:(e.load_kg&&Number(e.load_kg)!==0)?e.load_kg:'',actual_reps:parseSuggestedReps(e.reps),rir:e.rir_target??'',done:false,done_at:null});persistExec('plan_merge')}})}
function startSession(){let x=executionSession(current(),true);if(!x)return;if(!x.started_at)x.started_at=new Date().toISOString();if(x.status==='planned')x.status='in_progress';persistExec();renderTraining()}function finishSession(){let x=executionSession(current(),true);if(!x)return;x.status='finalized';x.finalized_at=new Date().toISOString();persistExec('app_finalize');stopRest();renderTraining()}function editFinalized(){let x=executionSession(current(),true);if(!x)return;x.status='in_progress';x.reopened_at=new Date().toISOString();persistExec('app_reopen');renderTraining()}function setField(eid,idx,field,val){let x=executionSession(current(),true);if(!x||x.status==='finalized')return;let st=x.exercises[eid].sets[idx];st[field]=val;if(!x.started_at)x.started_at=new Date().toISOString();if(x.status==='planned')x.status='in_progress';persistExec()}function toggleSet(eid,idx){let s=current(),x=executionSession(s,true);if(!x||x.status==='finalized')return;let st=x.exercises[eid].sets[idx];st.done=!st.done;st.done_at=st.done?new Date().toISOString():null;if(!x.started_at)x.started_at=new Date().toISOString();if(x.status==='planned')x.status='in_progress';persistExec();if(st.done){let pe=(s.exercises||[]).find(z=>z.exercise_id===eid);startRest(Number((pe&&pe.rest_seconds)||60),lib(eid).name,nextPendingLabel())}renderTraining()}function addSet(eid){let x=executionSession(current(),true);if(!x||x.status==='finalized')return;let arr=x.exercises[eid].sets,last=[...arr].reverse().find(z=>z.type==='work')||arr[arr.length-1]||{},n=arr.filter(z=>z.type==='work').length+1;arr.push({type:'work',index:n,planned_kg:'',planned_reps:'',actual_kg:last.actual_kg??'',actual_reps:last.actual_reps??'',rir:last.rir??'',done:false,done_at:null,added:true});persistExec();renderTraining()}
function statsFor(s){let x=executionSession(s,true),done=0,vol=0;Object.values(x.exercises||{}).forEach(ex=>(ex.sets||[]).forEach(st=>{if(st.done){done++;vol+=num(st.actual_kg)*num(st.actual_reps)}}));let dur='00:00';if(x.started_at){let end=x.finalized_at?new Date(x.finalized_at).getTime():Date.now(),ms=Math.max(0,end-new Date(x.started_at).getTime());dur=fmtLong(ms)}return{done,vol:Math.round(vol),dur}}function fmtLong(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}function nextPendingLabel(){let s=current(),x=executionSession(s,true);for(let e of(s.exercises||[])){let ex=x.exercises[e.exercise_id];if(ex&&(ex.sets||[]).some(z=>!z.done))return'Siguiente: '+lib(e.exercise_id).name}return'Última serie · sesión completa'}function scrollNextPending(){let s=current(),x=executionSession(s,true);for(let e of(s.exercises||[])){let ex=x.exercises[e.exercise_id];for(let i=0;i<(ex.sets||[]).length;i++)if(!ex.sets[i].done){let el=document.getElementById('set_'+e.exercise_id+'_'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return}}}function changeDay(d){sessionIndex=Math.max(0,Math.min(sessions.length-1,sessionIndex+d));exerciseIndex=0;renderTraining()}function changeExercise(d){let a=(current()&&current().exercises)||[];exerciseIndex=Math.max(0,Math.min(a.length-1,exerciseIndex+d));renderExerciseDetail()}
function startRest(sec,name,next){clearInterval(restTimer);restEnd=Date.now()+sec*1000;restLabel=name||'Descanso';restNext=next||'';restTimer=setInterval(tickRest,250);tickRest()}function tickRest(){let left=Math.max(0,restEnd-Date.now());if(screen==='training'||screen==='exerciseDetail')renderRestBar(left);if(left<=0){clearInterval(restTimer);restTimer=null;if(window.Android)Android.longCue();renderRestBar(0)}}function renderRestBar(left){let el=$('restMount');if(!el)return;if(!restEnd){el.innerHTML='';return}el.innerHTML='<div class="restbar"><div class="rclock">'+fmt(left)+'</div><div class="rtext"><b>'+esc(restLabel)+'</b><small>'+esc(restNext)+(left<=0?' · terminado ✓':'')+'</small></div><button onclick="stopRest()">SALTAR</button></div>'}function stopRest(){clearInterval(restTimer);restTimer=null;restEnd=0;let el=$('restMount');if(el)el.innerHTML=''}function fmt(ms){let s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function home(){screen='home';hideMic();clearInterval(sessionTicker);let h='<div class="card"><div class="status">SALUD 360</div><div class="title">Tu panel</div><div class="subtitle">Drive conserva la información. La app la muestra y, en Entrenamiento, registra la ejecución real.</div></div><div class="modules">';let mods=[['entrenamiento','🏋️ Entrenamiento','Sesión del día, series, descansos y registro real.','openTraining()'],['alimentacion','🍽 Alimentación','Plan e historial de comidas.','openFood()'],['recetas','📖 Recetas','Recetas guardadas y preparación.','openRecipes()'],['compra','🛒 Lista de compra','Qué falta comprar.','openShopping()'],['despensa','🧺 Despensa','Qué hay disponible en casa.','openPantry()'],['consumibles','🔁 Consumibles','Filtros, recambios y mantenimiento.','openConsumables()'],['sueno','😴 Sueño','Resumen operativo y recuperación.',"openSimpleModule('sleep','😴 Sueño')"],['suplementacion','💊 Suplementación','Criterios y seguimiento.',"openSimpleModule('supplements','💊 Suplementación')"],['hiit','⏱ HIIT','Circuitos e intervalos.','openHiit()']];mods.forEach(([id,n,s,fn])=>{if(enabled(id))h+='<button class="module" onclick="'+fn+'"><strong>'+n+'</strong><small>'+s+'</small></button>'});h+='</div>';$('content').innerHTML=h}
function openTraining(){screen='training';selectToday();renderTraining();showMic()}function renderTraining(){let s=current();if(!s){$('content').innerHTML='<div class="empty">No hay sesiones cargadas.</div>';return}if(s.module==='hiit'&&!(s.exercises||[]).length){openHiit();return}normalizeExecAgainstPlan(s);let x=executionSession(s,true),stats=statsFor(s),locked=x.status==='finalized';let h='<div id="restMount"></div><div class="navbar"><button onclick="changeDay(-1)">← DÍA</button><button onclick="changeDay(1)">DÍA →</button></div>';h+='<div class="card"><div class="status">'+esc((DATA.plan&&DATA.plan.program&&DATA.plan.program.name)||'ENTRENAMIENTO')+'</div><div class="title">'+esc(s.title||'Sesión')+'</div><div class="subtitle">'+esc(dayLabel(s))+(s.cycle_day?' · '+esc(s.cycle_day):'')+'</div>';h+='<div class="stats"><div class="stat"><small>DURACIÓN</small><b>'+stats.dur+'</b></div><div class="stat"><small>VOLUMEN</small><b>'+stats.vol+' kg</b></div><div class="stat"><small>SERIES</small><b>'+stats.done+'</b></div></div>';h+='<div style="margin-top:10px">'+(locked?'<span class="pill ok">FINALIZADA</span>':x.status==='in_progress'?'<span class="pill warn">EN CURSO</span>':'<span class="pill">PREVISTA</span>')+'</div>';if(s.notes)h+='<div class="cue">'+esc(s.notes)+'</div>';h+='</div>';(s.exercises||[]).forEach((e,i)=>h+=exerciseBlock(s,e,i,x,locked));h+='<div class="sessionActions">';if(locked)h+='<button class="secondary" onclick="editFinalized()">✎ EDITAR SESIÓN FINALIZADA</button>';else h+='<div class="row"><button onclick="scrollNextPending()">↓ SIGUIENTE PENDIENTE</button><button class="blue" onclick="'+(x.status==='planned'?'startSession()':'finishSession()')+'">'+(x.status==='planned'?'INICIAR':'FINALIZAR')+'</button></div>';h+='</div>';$('content').innerHTML=h;screen='training';renderRestBar(Math.max(0,restEnd-Date.now()));clearInterval(sessionTicker);sessionTicker=setInterval(()=>{if(screen==='training'&&!document.hidden){let st=statsFor(current()),els=document.querySelectorAll('.stat b');if(els.length)els[0].textContent=st.dur}},1000)}
function exerciseBlock(s,e,i,x,locked){let L=lib(e.exercise_id),ex=x.exercises[e.exercise_id]||{sets:[]},im=imgFor(L,'thumb'),done=(ex.sets||[]).filter(z=>z.done).length,total=(ex.sets||[]).length;let h='<div class="exerciseCard"><div class="exerciseHead" onclick="exerciseIndex='+i+';renderExerciseDetail()"><div class="thumb">'+(im?'<img src="'+im+'">':'IMAGEN<br>PENDIENTE')+'</div><div><div class="exerciseName">'+esc(L.name)+'</div><div class="exerciseMeta">'+esc(L.category)+' · '+done+'/'+total+' series</div></div><div class="chev">›</div></div>';h+='<div class="setHeader"><span>Serie</span><span>Previsto</span><span>Kg</span><span>Reps</span><span>✓</span></div>';(ex.sets||[]).forEach((st,idx)=>{h+='<div id="set_'+esc(e.exercise_id)+'_'+idx+'" class="setRow '+(st.done?'done':'')+'"><div class="setNo '+(st.type==='warmup'?'warm':'')+'">'+(st.type==='warmup'?'W':st.index)+'</div><div class="planned">'+esc(planText(st))+'</div><input class="setInput" inputmode="decimal" value="'+esc(st.actual_kg)+'" '+(locked?'disabled':'')+' onchange="setField(\''+esc(e.exercise_id)+'\','+idx+',\'actual_kg\',this.value)"><input class="setInput" inputmode="numeric" value="'+esc(st.actual_reps)+'" '+(locked?'disabled':'')+' onchange="setField(\''+esc(e.exercise_id)+'\','+idx+',\'actual_reps\',this.value)"><button class="check '+(st.done?'on':'')+'" '+(locked?'disabled':'')+' onclick="toggleSet(\''+esc(e.exercise_id)+'\','+idx+')">'+(st.done?'✓':'○')+'</button></div>'});if(!locked)h+='<button style="width:100%;margin-top:8px;min-height:44px" onclick="addSet(\''+esc(e.exercise_id)+'\')">＋ Añadir serie</button>';h+='</div>';return h}
function renderExerciseDetail(){let s=current(),arr=(s&&s.exercises)||[];if(!arr.length){renderTraining();return}exerciseIndex=Math.max(0,Math.min(arr.length-1,exerciseIndex));let e=arr[exerciseIndex],L=lib(e.exercise_id),x=executionSession(s,true),locked=x.status==='finalized',a=imgFor(L,'start'),b=imgFor(L,'end');let h='<div id="restMount"></div><div class="navbar"><button onclick="changeDay(-1)">← DÍA</button><button onclick="changeDay(1)">DÍA →</button></div><div class="navbar"><button onclick="changeExercise(-1)">← EJERCICIO</button><button onclick="changeExercise(1)">EJERCICIO →</button></div><button class="secondary" onclick="renderTraining()">← VOLVER A LA SESIÓN</button>';h+='<div class="card"><div class="status">'+esc(dayLabel(s))+' · '+(exerciseIndex+1)+'/'+arr.length+'</div><div class="title">'+esc(L.name)+'</div><div class="subtitle">'+esc(L.category)+'</div><div class="detailImages"><div class="detailImg">'+(a?'<img src="'+a+'">':'INICIO · IMAGEN PENDIENTE')+'</div><div class="detailImg">'+(b?'<img src="'+b+'">':'FINAL · IMAGEN PENDIENTE')+'</div></div><div class="cue"><b>Hoy:</b><br>'+esc(e.execution||'Ejecución controlada y técnicamente limpia.')+'<br><br><b>Descanso:</b> '+esc(e.rest_label||fmt(Number(e.rest_seconds||60)*1000))+(e.rir_target!=null?'<br><b>RIR objetivo:</b> '+esc(e.rir_target):'')+'</div><details class="details" open><summary>¿Cómo se hace?</summary><p>'+esc(L.how_to)+'</p></details></div>';h+=exerciseBlock(s,e,exerciseIndex,x,locked);$('content').innerHTML=h;screen='exerciseDetail';showMic();renderRestBar(Math.max(0,restEnd-Date.now()))}
function render(){if(screen==='training')renderTraining();else if(screen==='exerciseDetail')renderExerciseDetail();else if(screen==='food')renderFood();else if(screen==='recipes')renderRecipes();else if(screen==='shopping')renderShopping();else if(screen==='pantry')renderPantry();else if(screen==='consumables')renderConsumables();else if(screen==='settings')renderSettings();else if(screen==='hiit')renderHiit();else if(screen.startsWith('simple_')){let key=screen.substring(7);openSimpleModule(key,key==='sleep'?'😴 Sueño':'💊 Suplementación')}else home()}
function foodData(){return(DATA&&DATA.modules&&DATA.modules.alimentacion)||{}}function foodDays(){let f=foodData(),p=(f.plan&&f.plan.days)||[],h=(f.history&&f.history.days)||[],by={};[...h,...p].forEach(d=>{if(d&&d.date)by[d.date]=Object.assign({},by[d.date]||{},d,{meals:d.meals||((by[d.date]||{}).meals)||[]})});return Object.values(by).sort((a,b)=>a.date.localeCompare(b.date))}function openFood(){screen='food';foodTab='today';renderFood();showMic()}function renderFood(){let h='<div class="tabs"><button onclick="foodTab=\'today\';renderFood()">HOY</button><button onclick="foodTab=\'history\';renderFood()">HISTORIAL</button><button onclick="openRecipes()">RECETAS</button></div>',days=foodDays();if(!days.length){$('content').innerHTML=h+'<div class="empty">No hay comidas cargadas todavía.</div>';return}let idx=foodTab==='today'?days.findIndex(d=>d.date===todayIso()):foodDayIndex;if(idx<0)idx=days.length-1;foodDayIndex=Math.max(0,Math.min(days.length-1,idx));let d=days[foodDayIndex];h+='<div class="card"><div class="status">ALIMENTACIÓN</div><div class="title">'+esc(d.title||dayLabel({date:d.date}))+'</div><div class="subtitle">'+esc(d.notes||'')+'</div></div>';(d.meals||[]).forEach(m=>h+='<div class="listItem"><b>'+esc(m.name||'Comida')+'</b><small>'+esc([m.time,m.quantity_text,m.description].filter(Boolean).join(' · '))+'</small></div>');if(foodTab==='history')h+='<div class="row"><button onclick="foodDayIndex=Math.max(0,foodDayIndex-1);renderFood()">← DÍA</button><button onclick="foodDayIndex=Math.min(foodDays().length-1,foodDayIndex+1);renderFood()">DÍA →</button></div>';$('content').innerHTML=h}
function recipesObj(){let r=(foodData().recipes&&foodData().recipes.recipes)||{};return Array.isArray(r)?Object.fromEntries(r.map((x,i)=>[x.id||String(i),x])):r}function openRecipes(){screen='recipes';renderRecipes();showMic()}function renderRecipes(){let r=recipesObj(),keys=Object.keys(r),h='<div class="card"><div class="status">RECETAS</div><div class="title">Biblioteca</div><div class="subtitle">Recetas guardadas en Drive.</div></div>';if(!keys.length)h+='<div class="empty">Todavía no hay recetas guardadas en la proyección del visor.</div>';keys.forEach(k=>{let x=r[k];h+='<div class="listItem" onclick="openRecipe(\''+esc(k)+'\')"><b>'+esc(x.name||k)+'</b><small>'+esc(x.summary||'')+'</small></div>'});$('content').innerHTML=h}function openRecipe(id){let x=recipesObj()[id];if(!x)return;let h='<button class="secondary" onclick="renderRecipes()">← RECETAS</button><div class="card"><div class="status">RECETA</div><div class="title">'+esc(x.name||id)+'</div>';if(x.ingredients)h+='<div class="cue"><b>Ingredientes</b><br>'+esc(Array.isArray(x.ingredients)?x.ingredients.join('\n'):x.ingredients).replace(/\n/g,'<br>')+'</div>';if(x.steps)h+='<details class="details" open><summary>Preparación</summary><p>'+esc(Array.isArray(x.steps)?x.steps.join('\n\n'):x.steps)+'</p></details>';h+='</div>';$('content').innerHTML=h}
function openShopping(){screen='shopping';renderShopping();showMic()}function renderShopping(){let m=(DATA&&DATA.modules&&DATA.modules.shopping)||{},items=m.items||[],h='<div class="card"><div class="status">LISTA DE COMPRA</div><div class="title">Compra</div><div class="subtitle">'+esc(m.note||'')+'</div></div>';if(!items.length)h+='<div class="empty">No hay productos marcados para comprar.</div>';items.forEach(x=>h+='<div class="listItem"><b>'+esc(x.name||'Producto')+'</b><small>'+esc([x.quantity,x.notes].filter(Boolean).join(' · '))+'</small></div>');$('content').innerHTML=h}
function openPantry(){screen='pantry';renderPantry();showMic()}function renderPantry(){let m=(DATA&&DATA.modules&&DATA.modules.pantry)||{},cats=m.categories||[],h='<div class="card"><div class="status">DESPENSA</div><div class="title">Disponible en casa</div><div class="subtitle">'+esc(m.note||'')+'</div></div>';if(!cats.length)h+='<div class="empty">Sin datos de despensa.</div>';cats.forEach(c=>{h+='<div class="card"><div class="status">'+esc(c.name)+'</div>';(c.items||[]).forEach(x=>h+='<div class="listItem"><b>'+esc(x.name)+'</b><small><span class="pill ok">'+esc(x.status||'')+'</span>'+esc(x.quantity||'')+'</small></div>');h+='</div>'});$('content').innerHTML=h}
function openConsumables(){screen='consumables';renderConsumables();showMic()}function renderConsumables(){let m=(DATA&&DATA.modules&&DATA.modules.consumables)||{},items=m.items||[],h='<div class="card"><div class="status">CONSUMIBLES</div><div class="title">Mantenimiento</div></div>';if(!items.length)h+='<div class="empty">No hay consumibles registrados.</div>';items.forEach(x=>h+='<div class="listItem"><b>'+esc(x.name)+'</b><small>'+esc([x.product,'Instalado: '+(x.installed_on||'—'),'Cambio máximo: '+(x.max_replace_on||'—'),x.rule].filter(Boolean).join(' · '))+'</small></div>');$('content').innerHTML=h}
function openSimpleModule(key,title){screen='simple_'+key;let m=(DATA&&DATA.modules&&DATA.modules[key])||{},h='<div class="card"><div class="status">'+esc(m.status||'SALUD 360')+'</div><div class="title">'+title+'</div><div class="subtitle">Actualizado: '+esc(m.updated_at||'—')+'</div></div>';(m.items||[]).forEach(x=>h+='<div class="listItem"><small>'+esc(x)+'</small></div>');if(!(m.items||[]).length)h+='<div class="empty">Sin datos visibles todavía.</div>';$('content').innerHTML=h;showMic()}
function openHiit(){screen='hiit';hiitState=null;renderHiit();showMic()}function renderHiit(){let h=DATA&&DATA.modules&&DATA.modules.hiit;if(!h||!Object.keys(h).length){$('content').innerHTML='<div class="empty">No hay circuito HIIT cargado.</div>';return}if(!hiitState){$('content').innerHTML='<div class="card"><div class="status">HIIT</div><div class="title">'+esc(h.title||'Circuito')+'</div><div class="subtitle">'+esc(h.description||'')+'</div></div><button class="primary" onclick="startHiit()">INICIAR</button>';return}$('content').innerHTML='<div class="card hiit"><div class="status">RONDA '+hiitState.round+' / '+(h.rounds||1)+'</div><h2>'+esc(hiitState.phase==='work'?(h.work_label||'TRABAJO'):(h.rest_label||'RECUPERACIÓN'))+'</h2><div class="big">'+hiitState.left+'</div></div><button class="secondary" onclick="stopHiit()">DETENER</button>'}function startHiit(){let h=DATA.modules.hiit;hiitState={round:1,phase:'work',left:Number(h.work_seconds||20)};clearInterval(hiitTimer);hiitTimer=setInterval(()=>{if(!hiitState)return;hiitState.left--;if(hiitState.left<=0){if(window.Android)Android.cue();if(hiitState.phase==='work'){hiitState.phase='rest';hiitState.left=Number(h.rest_seconds||40)}else if(hiitState.round<Number(h.rounds||1)){hiitState.round++;hiitState.phase='work';hiitState.left=Number(h.work_seconds||20)}else{clearInterval(hiitTimer);hiitState=null;if(window.Android)Android.longCue();$('content').innerHTML='<div class="card"><div class="title">HIIT terminado ✓</div></div>';return}}renderHiit()},1000);renderHiit()}function stopHiit(){clearInterval(hiitTimer);hiitState=null;renderHiit()}

function activeContext(){if(screen==='training'||screen==='exerciseDetail'){let s=current(),e=s&&(s.exercises||[])[exerciseIndex];return{session:s?(s.date+' · '+(s.title||'')):'',exercise:e?lib(e.exercise_id).name:''}}return{session:'Salud 360 · '+todayIso()+' · '+screen,exercise:''}}function showMic(){$('micButton').classList.remove('hidden');$('voiceInfo').classList.remove('hidden');updateVoicePending()}function hideMic(){$('micButton').classList.add('hidden');$('voiceInfo').classList.add('hidden')}function toggleVoice(){if(!window.Android)return;if(recording)Android.stopVoice();else{let c=activeContext();Android.startVoice(c.session,c.exercise)}}function startVoiceFromMenu(){showMic();toggleVoice()}function updateVoicePending(){try{let n=window.Android?Android.pendingVoiceCount():0;$('voiceInfo').textContent=n?n+' nota'+(n===1?'':'s')+' de voz pendiente'+(n===1?'':'s')+' de sincronizar':''}catch(e){}}window.onVoiceStatus=function(status,detail){recording=status==='recording';$('micButton').classList.toggle('recording',recording);$('micButton').textContent=recording?'■ PARAR Y GUARDAR':'🎙 NOTA DE VOZ';$('voiceInfo').classList.remove('hidden');$('voiceInfo').textContent=detail||'';setTimeout(updateVoicePending,1200)}
function openMenu(){$('menu').classList.remove('hidden')}function closeMenu(){$('menu').classList.add('hidden')}function handleAndroidBack(){if(!$('menu').classList.contains('hidden')){closeMenu();return}if(screen==='exerciseDetail'){renderTraining();return}if(screen!=='home'){home();return}if(window.Android&&Android.exitApp)Android.exitApp()}window.handleAndroidBack=handleAndroidBack;
let sx=0,sy=0;document.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<80||Math.abs(dx)<Math.abs(dy)*1.5)return;if(screen==='exerciseDetail')changeExercise(dx<0?1:-1)},{passive:true});if(window.Android&&!Android.hasFolder())showSetup();
