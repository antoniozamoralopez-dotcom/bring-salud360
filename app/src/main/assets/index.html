<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Salud 360 · Entreno</title>
<style>
:root{--bg:#101114;--card:#1c1f24;--card2:#272b31;--txt:#f7f8f8;--muted:#adb4be;--green:#8be28b;--orange:#ffbe5c;--red:#ff7575}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);font-size:18px}.hidden{display:none!important}.top{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:rgba(16,17,20,.96);padding:4px 0 10px;z-index:5}.brand{flex:1}.brand b{display:block;color:var(--green);font-size:13px;letter-spacing:.08em}.brand span{font-size:16px;color:var(--muted)}.icon{width:48px;height:48px;border-radius:15px;border:0;background:var(--card);color:var(--txt);font-size:23px}.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0}.title{font-size:30px;line-height:1.08;font-weight:900;margin:4px 0}.subtitle{color:var(--muted);font-size:17px}.status{color:var(--green);font-weight:800;font-size:14px}.warning{color:var(--orange)}button{border:0;border-radius:17px;background:var(--card2);color:var(--txt);font:inherit;font-weight:900;min-height:58px;padding:12px 14px}button:disabled{opacity:.45}.primary{background:var(--green);color:#09250f;width:100%;font-size:20px}.secondary{width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.exercise-list button{display:block;width:100%;text-align:left;margin:9px 0;padding:15px}.exercise-list small{display:block;color:var(--muted);font-weight:600;margin-top:5px}.imgbox{height:210px;border-radius:18px;background:var(--card2);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);overflow:hidden}.imgbox img{width:100%;height:100%;object-fit:cover}.rx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metric{background:var(--card2);border-radius:17px;padding:13px}.metric small{display:block;color:var(--muted);font-size:13px;font-weight:800}.metric strong{display:block;font-size:25px;margin-top:3px}.cue{background:#242a24;border-left:5px solid var(--green);padding:14px;border-radius:12px;margin-top:12px;font-size:18px;line-height:1.35}.details{margin-top:12px}.details summary{background:var(--card2);padding:16px;border-radius:15px;font-weight:900;cursor:pointer}.details p{font-size:20px;line-height:1.55;margin:14px 4px 4px}.footerhint{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}.overlay{position:fixed;inset:0;background:#0c0d0f;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}.clock{font-size:72px;font-weight:950;line-height:1}.overlay h2{font-size:28px;margin:12px}.overlay .next{color:var(--muted);font-size:18px;margin-bottom:26px}.overlay button{width:min(420px,100%);margin-top:10px}.menu{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:30;padding:70px 18px 20px}.menubox{max-width:520px;margin:auto;background:var(--card);border-radius:24px;padding:18px}.menubox h2{margin:0 0 12px}.menubox button{width:100%;margin:7px 0;text-align:left}.setup{text-align:center;margin-top:10vh}.setup h1{font-size:34px}.setup p{color:var(--muted);line-height:1.45}.hiit-stage{text-align:center}.hiit-stage .kind{font-size:16px;color:var(--muted);font-weight:900}.hiit-stage .hiit-title{font-size:38px;font-weight:950;margin:8px 0}.hiit-stage .hiit-clock{font-size:86px;font-weight:950;line-height:1}.hiit-stage .hiit-cue{font-size:19px;color:var(--muted);margin:14px 0 24px}.dots{font-size:14px;color:var(--muted);margin-top:7px}
</style></head><body>
<div id="setup" class="setup hidden"><div class="status">SALUD 360 · VISOR</div><h1>Vincular carpeta</h1><p>Selecciona en Google Drive la carpeta <b>02_App_Visor_Entrenamiento_360</b>. Solo tendrás que hacerlo una vez.</p><button class="primary" onclick="Android.chooseFolder()">ELEGIR CARPETA DE DRIVE</button></div>
<div id="app" class="hidden"><div class="top"><button class="icon" onclick="openMenu()">☰</button><div class="brand"><b>SALUD 360 · ENTRENO</b><span id="syncLabel">Sincronizando…</span></div><button class="icon" onclick="manualSync()">↻</button></div><main id="content"></main></div>
<div id="restOverlay" class="overlay hidden"><div class="status">DESCANSO</div><div id="restClock" class="clock">00:00</div><h2 id="restTitle"></h2><div id="restNext" class="next"></div><button class="secondary" onclick="closeRest()">VOLVER AL EJERCICIO</button><button onclick="skipRest()">SALTAR DESCANSO</button></div>
<div id="menu" class="menu hidden"><div class="menubox"><h2>Menú</h2><button onclick="goToday();closeMenu()">📅 Sesión programada</button><button id="menuForce" class="hidden" onclick="openStrength();closeMenu()">🏋️ Fuerza / Pesas</button><button id="menuHiit" class="hidden" onclick="openHiit();closeMenu()">⏱️ HIIT / Circuitos</button><button onclick="manualSync();closeMenu()">↻ Sincronizar ahora</button><button onclick="changeFolder();closeMenu()">📁 Cambiar carpeta de Drive</button><button onclick="closeMenu()">Cerrar</button></div></div>
<script>
let DATA=null,sessions=[],sessionIndex=0,exerciseIndex=0,view='exercise',restTimer=null,restEnd=0,hiitTimer=null,hiitState=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showSetup(){$('setup').classList.remove('hidden');$('app').classList.add('hidden')}window.showSetup=showSetup;function manualSync(){if(window.Android){$('syncLabel').textContent='Sincronizando…';Android.refresh()}}function changeFolder(){if(window.Android){Android.forgetFolder();setTimeout(()=>Android.chooseFolder(),150)}}
window.onNativeSync=function(raw){let p;try{p=JSON.parse(raw)}catch(e){return}if(!p.ok){$('setup').classList.remove('hidden');$('app').classList.add('hidden');$('setup').querySelector('p').innerHTML='La carpeta está vinculada, pero <b>'+esc(p.error||'no puedo leer los archivos')+'</b>.<br><br>Vuelve a elegir la carpeta troncal correcta.';return}DATA=p;sessions=(p.plan&&p.plan.sessions)||[];$('setup').classList.add('hidden');$('app').classList.remove('hidden');$('syncLabel').textContent='Drive · '+(p.folder||'sincronizado');let enabled=(p.config&&p.config.enabled_modules)||[];$('menuHiit').classList.toggle('hidden',!enabled.includes('hiit'));$('menuForce').classList.toggle('hidden',!enabled.includes('fuerza'));selectToday();render()};
function selectToday(){if(!sessions.length){sessionIndex=0;return}const d=new Date(),iso=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');let idx=sessions.findIndex(s=>s.date===iso);if(idx<0){idx=sessions.findIndex(s=>s.date>iso);if(idx<0)idx=sessions.length-1}sessionIndex=idx;exerciseIndex=0}function current(){return sessions[sessionIndex]||null}function lib(id){return (((DATA||{}).library||{}).exercises||{})[id]||{name:id,category:'',how_to:'Sin explicación todavía.',image:''}};
function stateKey(eid){let s=current();return 'v02_'+(s?s.date:'x')+'_'+eid}function getState(eid){try{return JSON.parse(localStorage.getItem(stateKey(eid))||'{"wu":0,"sets":0}')}catch(e){return{wu:0,sets:0}}}function setState(eid,x){localStorage.setItem(stateKey(eid),JSON.stringify(x))}
function render(){let s=current();if(!s){$('content').innerHTML='<div class="card"><div class="title">Sin sesiones</div><div class="subtitle">No hay sesiones en plan.json.</div></div>';return}if(s.module==='hiit'){renderHiitSession(s);return}view==='day'?renderDay(s):renderExercise(s)}function dayLabel(s){return new Date(s.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}
function renderDay(s){let h='<div class="card"><div class="status">MODO DÍA</div><div class="title">'+esc(s.title||'Entrenamiento')+'</div><div class="subtitle">'+esc(dayLabel(s))+'</div>'+(s.notes?'<div class="cue warning">'+esc(s.notes)+'</div>':'')+'</div><div class="exercise-list">';(s.exercises||[]).forEach((e,i)=>{let L=lib(e.exercise_id),st=getState(e.exercise_id),done=(st.wu>=Number(e.warmup_sets||0)&&st.sets>=Number(e.work_sets||0));h+='<button onclick="exerciseIndex='+i+';view=\'exercise\';render()">'+(done?'✓ ':'')+esc(L.name)+'<small>'+esc(L.category)+' · '+(e.work_sets||0)+'×'+(e.reps||0)+(e.load_kg?' · '+e.load_kg+' kg':'')+'</small></button>'});h+='</div><div class="row"><button onclick="changeDay(-1)">← DÍA</button><button onclick="changeDay(1)">DÍA →</button></div><div class="footerhint">Desliza a izquierda o derecha para cambiar de día.</div>';$('content').innerHTML=h}
function renderExercise(s){let arr=s.exercises||[];if(!arr.length){view='day';renderDay(s);return}exerciseIndex=Math.max(0,Math.min(arr.length-1,exerciseIndex));let e=arr[exerciseIndex],L=lib(e.exercise_id),st=getState(e.exercise_id),wu=Number(e.warmup_sets||0),ws=Number(e.work_sets||0),phase=st.wu<wu?'Calentamiento '+(st.wu+1)+' / '+wu:st.sets<ws?'Serie '+(st.sets+1)+' / '+ws:'Ejercicio completado';let reps=st.wu<wu?(e.warmup_reps||e.reps):e.reps;let img=L.image?loadImage((DATA.config.images_folder||'03_Imagenes_Ejercicios')+'/'+L.image):'';let h='<div class="card"><div class="status">'+esc(dayLabel(s))+' · '+(exerciseIndex+1)+'/'+arr.length+'</div><div class="imgbox">'+(img?'<img src="'+img+'">':'IMAGEN PENDIENTE')+'</div><div class="title">'+esc(L.name)+'</div><div class="subtitle">'+esc(L.category)+'</div><div class="rx"><div class="metric"><small>FASE</small><strong>'+esc(phase)+'</strong></div><div class="metric"><small>REPETICIONES</small><strong>'+esc(reps)+'</strong></div><div class="metric"><small>CARGA</small><strong>'+(e.load_kg?esc(e.load_kg)+' kg':'—')+'</strong></div><div class="metric"><small>DESCANSO</small><strong>'+fmt((e.rest_seconds||60)*1000)+'</strong></div></div><div class="cue"><b>Ejecución de hoy:</b><br>'+esc(e.execution||'Controlada y técnicamente limpia.')+'</div><details class="details"><summary>¿Cómo se hace?</summary><p>'+esc(L.how_to)+'</p></details></div><button class="primary" '+((st.wu>=wu&&st.sets>=ws)?'disabled':'')+' onclick="completeSet()">✓ HECHO</button><div class="row" style="margin-top:10px"><button onclick="changeExercise(-1)">← EJERCICIO</button><button onclick="changeExercise(1)">EJERCICIO →</button></div><button class="secondary" style="margin-top:10px" onclick="view=\'day\';render()">VER EJERCICIOS DEL DÍA</button><div class="footerhint">Desliza para pasar al ejercicio anterior o siguiente.</div>';$('content').innerHTML=h}
function loadImage(path){try{return window.Android?Android.getImage(path):''}catch(e){return''}}function completeSet(){let s=current(),e=s.exercises[exerciseIndex],st=getState(e.exercise_id),wu=Number(e.warmup_sets||0),ws=Number(e.work_sets||0);if(st.wu<wu)st.wu++;else if(st.sets<ws)st.sets++;setState(e.exercise_id,st);let done=st.wu>=wu&&st.sets>=ws;startRest(Number(e.rest_seconds||60),lib(e.exercise_id).name,done?nextExerciseName():'Siguiente serie');render()}function nextExerciseName(){let s=current(),n=s.exercises[exerciseIndex+1];return n?'Después: '+lib(n.exercise_id).name:'Último ejercicio de la sesión'}
function startRest(sec,name,next){clearInterval(restTimer);restEnd=Date.now()+sec*1000;$('restTitle').textContent=name;$('restNext').textContent=next;$('restOverlay').classList.remove('hidden');tickRest();restTimer=setInterval(tickRest,250)}function tickRest(){let left=Math.max(0,restEnd-Date.now());$('restClock').textContent=fmt(left);if(left<=0){clearInterval(restTimer);restTimer=null;if(window.Android)Android.longCue();$('restNext').textContent='Descanso terminado ✓'}}function closeRest(){$('restOverlay').classList.add('hidden')}function skipRest(){restEnd=Date.now();tickRest();closeRest()}function fmt(ms){let s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function changeExercise(d){let s=current();exerciseIndex=Math.max(0,Math.min((s.exercises||[]).length-1,exerciseIndex+d));render()}function changeDay(d){sessionIndex=Math.max(0,Math.min(sessions.length-1,sessionIndex+d));exerciseIndex=0;render()}function goToday(){clearInterval(hiitTimer);hiitState=null;selectToday();view='exercise';render()}function openStrength(){clearInterval(hiitTimer);hiitState=null;let start=sessionIndex,idx=sessions.findIndex((s,i)=>i>=start&&s.module==='fuerza');if(idx<0)idx=sessions.findIndex(s=>s.module==='fuerza');if(idx>=0){sessionIndex=idx;exerciseIndex=0;view='exercise';render()}}
function openMenu(){$('menu').classList.remove('hidden')}function closeMenu(){$('menu').classList.add('hidden')}function openHiit(){let h=DATA&&DATA.modules&&DATA.modules.hiit;if(!h){$('content').innerHTML='<div class="card"><div class="title">HIIT</div><div class="subtitle">No hay un módulo HIIT cargado.</div></div>';return}hiitState={program:h,seq:expandHiit(h),idx:0,running:false,end:0};renderHiit()}function expandHiit(h){let out=[],r=Number(h.repeat||1);for(let k=0;k<r;k++)for(let b of (h.blocks||[]))out.push({...b,round:k+1});return out}
function renderHiit(){let x=hiitState;if(!x||!x.seq.length)return;let b=x.seq[x.idx];$('content').innerHTML='<div class="card hiit-stage"><div class="kind">MODO HIIT / CIRCUITO · RONDA '+b.round+'</div><div class="hiit-title">'+esc(b.title)+'</div><div id="hiitClock" class="hiit-clock">'+fmt((b.seconds||0)*1000)+'</div><div class="hiit-cue">'+esc(b.cue||'')+'</div><button id="hiitStart" class="primary" onclick="toggleHiit()">'+(x.running?'PAUSA':'INICIAR / CONTINUAR')+'</button><div class="row" style="margin-top:10px"><button onclick="resetHiit()">REINICIAR</button><button onclick="skipHiit()">SALTAR →</button></div><div class="dots">Bloque '+(x.idx+1)+' de '+x.seq.length+' · Los cambios son automáticos</div></div><button class="secondary" onclick="goToday()">VOLVER A SESIÓN PROGRAMADA</button>';if(x.running)updateHiitClock()}function toggleHiit(){let x=hiitState;if(!x.running){let b=x.seq[x.idx];x.running=true;x.end=Date.now()+(b.remaining||b.seconds)*1000;b.remaining=null;clearInterval(hiitTimer);hiitTimer=setInterval(tickHiit,150);if(window.Android)Android.cue()}else{let b=x.seq[x.idx];b.remaining=Math.max(0,(x.end-Date.now())/1000);x.running=false;clearInterval(hiitTimer);hiitTimer=null}renderHiit()}function tickHiit(){let x=hiitState,left=x.end-Date.now();if(left<=0){if(window.Android)Android.longCue();x.idx++;if(x.idx>=x.seq.length){clearInterval(hiitTimer);x.running=false;$('content').innerHTML='<div class="card hiit-stage"><div class="status">COMPLETADO</div><div class="hiit-title">Circuito terminado ✓</div><button class="primary" onclick="openHiit()">REPETIR</button></div>';return}let b=x.seq[x.idx];x.end=Date.now()+b.seconds*1000;renderHiit();if(window.Android)Android.cue();return}updateHiitClock()}function updateHiitClock(){let el=$('hiitClock');if(el&&hiitState)el.textContent=fmt(Math.max(0,hiitState.end-Date.now()))}function resetHiit(){clearInterval(hiitTimer);let h=hiitState.program;hiitState={program:h,seq:expandHiit(h),idx:0,running:false,end:0};renderHiit()}function skipHiit(){if(!hiitState)return;hiitState.end=Date.now();tickHiit()}function renderHiitSession(s){view='day';renderDay(s)}
let sx=0,sy=0;document.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.4&&!hiitState&&$('restOverlay').classList.contains('hidden')){if(view==='day')changeDay(dx<0?1:-1);else changeExercise(dx<0?1:-1)}},{passive:true});if(window.Android&&!Android.hasFolder())showSetup();
</script></body></html>
